name: Refresh election data

"on":
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Symlink repo to /Users/dean/Dev/vote (scripts hardcode this path)
        run: |
          sudo mkdir -p /Users/dean/Dev
          sudo ln -s "$GITHUB_WORKSPACE" /Users/dean/Dev/vote

      - name: Run refresh chain
        run: bash scripts/refresh_candidates.sh

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            TODAY=$(date -u +"%-d %B %Y")
            sed -i -E "s|<strong id=\"data-date\">[^<]+</strong>|<strong id=\"data-date\">$TODAY</strong>|" index.html
            git add index.html
            git commit -m "Automated data refresh ($(date -u +'%Y-%m-%d'))"
            git push
          fi
