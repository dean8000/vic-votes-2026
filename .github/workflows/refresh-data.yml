name: Refresh election data

on:
  schedule:
    # Run daily at 20:00 UTC (≈ 07:00 Melbourne during AEDT, 06:00 AEST).
    - cron: '0 20 * * *'
  workflow_dispatch:  # allow manual trigger from the Actions UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run refresh
        env:
          # Any script that writes to repo-absolute paths needs the right root.
          # Our scripts hard-code /Users/dean/Dev/vote; symlink to the checkout.
          REPO_ROOT: ${{ github.workspace }}
        run: |
          sudo mkdir -p /Users/dean/Dev
          sudo ln -s "$REPO_ROOT" /Users/dean/Dev/vote
          bash scripts/refresh_candidates.sh

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            # Update home page 'last refreshed' date to today
            TODAY=$(date -u +'%d %B %Y' | sed 's/^0//')
            sed -i -E "s|<strong id=\"data-date\">[^<]+</strong>|<strong id=\"data-date\">$TODAY</strong>|" index.html
            git add index.html
            git commit -m "Automated data refresh ($(date -u +'%Y-%m-%d'))

- Polling: re-pulled from Wikipedia tracker
- Candidates: re-pulled from Wikipedia + ABC + party sites
- Projections: rebuilt from current swing
"
            git push
          fi
